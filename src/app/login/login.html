<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <img src="assets/img/logo.png" alt="Cheese & Cream" class="login-logo">
    <p class="eyebrow">Libro de bodega</p>
    <h1 id="login-title">Bienvenido</h1>
    <p>Ingresa tus credenciales para continuar.</p>
    <form (ngSubmit)="submit()" novalidate>
      <div class="form-group">
        <label for="username">Usuario</label>
        <input id="username" class="form-control" type="text" name="username" autocomplete="username" [(ngModel)]="username" [class.is-invalid]="isUsernameInvalid()">
        <span *ngIf="isUsernameInvalid()" class="field-error">El usuario es obligatorio.</span>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" class="form-control" type="password" name="password" autocomplete="current-password" [(ngModel)]="password" [class.is-invalid]="isPasswordInvalid()">
        <span *ngIf="isPasswordInvalid()" class="field-error">La contraseña es obligatoria.</span>
      </div>
      <button type="submit" class="btn btn-primary login-submit" [disabled]="isSubmitting">{{ isSubmitting ? 'Ingresando...' : 'Ingresar' }}</button>
    </form>
    <div *ngIf="error" class="inline-alert" role="alert">{{ error }}</div>
  </section>
</main>
